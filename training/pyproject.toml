[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter-arena-training"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["gymnasium==1.2.1", "stable-baselines3==2.7.0", "sb3-contrib==2.7.0", "torch==2.8.0", "numpy==2.3.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["hunter_arena_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
